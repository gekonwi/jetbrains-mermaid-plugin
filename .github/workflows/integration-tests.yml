name: Integration Tests with AI Validation

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Run Integration Tests with Ollama
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run containerized integration tests
        run: |
          chmod +x run-containerized-tests.sh
          ./run-containerized-tests.sh
        continue-on-error: true
        id: tests
      
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: build/test-screenshots/
          if-no-files-found: warn
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 7
      
      - name: Check test result
        if: steps.tests.outcome != 'success'
        run: |
          echo "Integration tests failed"
          exit 1
